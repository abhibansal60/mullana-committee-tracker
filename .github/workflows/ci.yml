name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: committee_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d committee_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # localhost URL: the DB-backed tests (google-link.test.ts) only run against a local database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/committee_test
      AUTH_SECRET: ci-only-secret-at-least-32-bytes-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx drizzle-kit migrate
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npm test
      - run: npm run build
